<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FavDate — Descoberta de lugares e conexões</title>
<style>
  :root{--accent:#F94B56;--bg:#121212;--card:#1E1E1E;--border:#2A2A2A;--text:#E0E0E0;--muted:#B0B0B0}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--text);line-height:1.6}
  header{background:var(--card);border-bottom:1px solid var(--border)}
  .nav{max-width:760px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:24px}
  .nav .brand{font-size:1.1em;font-weight:700;color:#fff;text-decoration:none}
  .nav .brand span{color:var(--accent)}
  .nav a.lnk{color:var(--muted);text-decoration:none;font-size:.9em}
  .nav a.lnk:hover{color:#fff}
  main{max-width:760px;margin:0 auto;padding:48px 24px 64px;text-align:center}
  .logo{width:96px;height:96px;border-radius:24px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:2.2em;font-weight:800;color:#fff;margin:0 auto}
  h1{font-size:2.2em;line-height:1.2;color:#fff;margin:24px 0 12px}
  h1 span{color:var(--accent)}
  p.sub{color:var(--muted);font-size:1.1em;max-width:520px;margin:0 auto}
  .links{margin-top:40px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
  .btn{display:inline-block;background:var(--card);border:1px solid var(--border);color:#fff;text-decoration:none;padding:12px 24px;border-radius:999px;font-weight:600}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  footer{max-width:760px;margin:0 auto;padding:24px;border-top:1px solid var(--border);color:var(--muted);font-size:.85em;text-align:center}
  footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a class="brand" href="index.html">Fav<span>Date</span></a>
    <a class="lnk" href="privacidade.html">Privacidade</a>
    <a class="lnk" href="termos.html">Termos de Uso</a>
    <a class="lnk" href="exclusao-de-conta.html">Excluir Conta</a>
  </div>
</header>
<main>
  <div class="logo">FD</div>
  <h1>Fav<span>Date</span></h1>
  <p class="sub">Descubra lugares incríveis e faça novas conexões.</p>
  <div class="links">
    <a class="btn" href="privacidade.html">Política de Privacidade</a>
    <a class="btn" href="termos.html">Termos de Uso</a>
    <a class="btn" href="exclusao-de-conta.html">Excluir Conta</a>
  </div>
</main>
<footer>
  FavDate © 2026 — <a href="privacidade.html">Política de Privacidade</a> · <a href="termos.html">Termos de Uso</a> · <a href="exclusao-de-conta.html">Excluir Conta</a>
</footer>
</body>
</html>
